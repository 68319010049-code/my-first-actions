name: Deploy Static Web - Supattarawadee Khunphetrsri 049

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # แก้ไขบรรทัดนี้เป็น actions/checkout@v4
      - name: Checkout Code - Supattarawadee Khunphetrsri 049
        uses: actions/checkout@v4

      # Deploy ไปยัง GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./